
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10091f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Empire">
<title>Club Empire - Idle Nightclub Tycoon</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #10091f;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  user-select: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.hud {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.stat {
  background: rgba(20, 10, 40, .9);
  border: 1px solid rgba(180, 90, 255, .45);
  border-radius: 13px;
  padding: 10px 12px;
  min-width: 0;
  box-shadow: 0 4px 18px #0005;
}

.stat small {
  display: block;
  color: #c6a9e9;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat strong {
  display: block;
  font-size: 16px;
  margin-top: 3px;
  white-space: nowrap;
}

.brand {
  position: fixed;
  top: max(86px, calc(env(safe-area-inset-top) + 78px));
  left: 0;
  right: 0;
  text-align: center;
  z-index: 2;
  pointer-events: none;
  text-shadow: 0 2px 15px #a000ff;
}

.brand h1 {
  margin: 0;
  font-size: 23px;
  letter-spacing: 3px;
}

.brand p {
  margin: 4px;
  color: #d5b7ff;
  font-size: 10px;
  letter-spacing: 2px;
}

.bottom {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 3;
  display: grid;
  gap: 9px;
}

.info {
  display: flex;
  justify-content: space-between;
  background: rgba(18, 9, 35, .94);
  border: 1px solid #65418e;
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 12px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

button {
  border: 0;
  border-radius: 13px;
  min-height: 53px;
  color: white;
  font-weight: 800;
  font-size: 13px;
  background: linear-gradient(135deg, #8527df, #4e18a7);
  box-shadow: 0 4px 16px #0007;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:active { transform: scale(.97); }

button:disabled {
  opacity: .45;
}

.secondary {
  background: linear-gradient(135deg, #087f9c, #164d87);
}

#message {
  text-align: center;
  color: #e5c5ff;
  font-size: 12px;
  min-height: 16px;
  text-shadow: 0 2px 5px black;
}

#notice {
  position: fixed;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  z-index: 5;
  width: 85%;
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  background: #291345;
  border: 1px solid #b76cff;
  display: none;
  box-shadow: 0 10px 40px #0009;
}

</style>
</head>

<body>

<div id="game"></div>

<div class="hud">
  <div class="stat">
    <small>CLUB CASH</small>
    <strong id="cash">$500</strong>
  </div>

  <div class="stat">
    <small>INCOME / SEC</small>
    <strong id="income">$5</strong>
  </div>

  <div class="stat">
    <small>CLUB LEVEL</small>
    <strong id="level">1</strong>
  </div>
</div>

<div class="brand">
  <h1>CLUB EMPIRE</h1>
  <p>IDLE NIGHTCLUB TYCOON</p>
</div>

<div class="bottom">

  <div class="info">
    <span>🕺 Customers</span>
    <strong id="customers">5 / 20</strong>
  </div>

  
<div class="buttons">
  <button id="upgrade">🎧 UPGRADE DJ<br>$250</button>
  <button id="expand" class="secondary">✨ CLUB EXPANSION<br>$2,500</button>
  <button id="buildBar" class="secondary">🍹 BUILD BAR<br>$1,000</button>
  <button id="hireBartender">🧑‍🍳 HIRE BARTENDER<br>$500</button>
  <button id="upgradeBar" class="secondary">⭐ UPGRADE BAR<br>$1,500</button>
</div>

  <div id="message">Welcome to your nightclub!</div>

</div>

<div id="notice"></div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

// ---------------------------
// GAME DATA
// ---------------------------

const defaults = {
  cash: 500,
  income: 5,
  level: 1,
  customers: 5,
  capacity: 20,
  djCost: 250,
  expansionCost: 2500,
  barBuilt: 0,
bartender: 0,
barLevel: 0,
  lastSeen: Date.now()
};

let data = {...defaults};

try {
  const saved = JSON.parse(
    localStorage.getItem('clubEmpireSave') || 'null'
  );

  if (saved && typeof saved === 'object') {
    for (const key of Object.keys(defaults)) {
      if (Number.isFinite(saved[key])) {
        data[key] = Math.max(0, saved[key]);
      }
    }
  }
} catch (e) {
  console.log('Starting a new game');
}

const elapsed = Math.max(
  0,
  (Date.now() - data.lastSeen) / 1000
);

const offlineSeconds = Math.min(elapsed, 8 * 3600);
const offlineMoney = Math.floor(
  offlineSeconds * data.income
);

data.cash += offlineMoney;
data.lastSeen = Date.now();

function saveGame() {
  data.lastSeen = Date.now();

  try {
    localStorage.setItem(
      'clubEmpireSave',
      JSON.stringify(data)
    );
  } catch (e) {
    console.log('Save unavailable', e);
  }
}

// ---------------------------
// THREE JS SETUP
// ---------------------------

const container = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10091f);

const camera = new THREE.OrthographicCamera(
  -9, 9, 9, -9, 0.1, 100
);

camera.position.set(11, 13, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = false;

container.appendChild(renderer.domElement);

// ---------------------------
// MATERIALS
// ---------------------------

function material(color, emissive = 0x000000) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.65,
    metalness: 0.1,
    emissive,
    emissiveIntensity: 0.8
  });
}

const floorMat = material(0x211537);
const purple = material(0x8a24dc, 0x4c087e);
const blue = material(0x00bce8, 0x007ba0);
const pink = material(0xf02e9e, 0x880052);
const black = material(0x11101b);
const gold = material(0xe4aa38, 0x805010);
const wood = material(0x69402d);

// ---------------------------
// OBJECT BUILDER
// ---------------------------

function box(w, h, d, x, y, z, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );

  mesh.position.set(x, y, z);
  scene.add(mesh);

  return mesh;
}

// ---------------------------
// FLOOR
// ---------------------------

box(13, 0.4, 11, 0, -0.25, 0, floorMat);

// Dance floor

box(5, 0.15, 4, 0, 0.05, 0, purple);

// Neon borders

box(5.2, 0.08, 0.12, 0, 0.15, 2.05, blue);
box(5.2, 0.08, 0.12, 0, 0.15, -2.05, pink);
box(0.12, 0.08, 4.1, 2.55, 0.15, 0, blue);
box(0.12, 0.08, 4.1, -2.55, 0.15, 0, pink);

// DJ stage

box(3.4, 0.4, 1.4, 0, 0.35, -3.2, black);
box(2.8, 0.9, 0.5, 0, 1, -3.2, blue);

// DJ equipment

box(1.5, 0.12, 0.6, 0, 1.5, -3.2, pink);

// Speakers

box(0.6, 1.7, 0.7, -2.2, 0.85, -3.1, black);
box(0.6, 1.7, 0.7, 2.2, 0.85, -3.1, black);

// Bar

box(3, 0.9, 1, -4.2, 0.5, 0, wood);
box(3.1, 0.1, 1.1, -4.2, 1, 0, blue);

// VIP

box(3, 0.3, 2.2, 4.1, 0.15, 3.1, gold);
box(2.7, 0.6, 0.4, 4.1, 0.5, 2.4, pink);

// Pillars

for (const x of [-5.6, 5.6]) {
  for (const z of [-4.5, 4.5]) {
    box(0.35, 3, 0.35, x, 1.5, z, purple);
  }
}

// Small neon decorations

for (let i = -2; i <= 2; i++) {
  box(0.08, 0.05, 3.5, i, 0.14, 0,
      i % 2 === 0 ? blue : pink);
}

// ---------------------------
// LIGHTS
// ---------------------------

scene.add(
  new THREE.AmbientLight(0xffffff, 1.6)
);

const mainLight = new THREE.DirectionalLight(
  0xffffff, 2
);

mainLight.position.set(5, 10, 5);
scene.add(mainLight);

const lights = [];

function addLight(color, x, y, z) {
  const light = new THREE.PointLight(
    color, 22, 10
  );

  light.position.set(x, y, z);
  scene.add(light);

  lights.push(light);
}

addLight(0x9c23ff, 0, 4, 0);
addLight(0x00ccff, -4, 3, 0);
addLight(0xff168a, 4, 3, 2);

// ---------------------------
// CUSTOMERS
// ---------------------------

const dancers = [];

function createPerson(index) {
  const group = new THREE.Group();

  const colors = [
    0xff5c9d,
    0x36c7ff,
    0xffc247,
    0x9d73ff,
    0x39dcaa
  ];

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.15, 0.2, 0.65, 8
    ),
    material(colors[index % colors.length])
  );

  body.position.y = 0.5;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 10, 8),
    material(0xffc99e)
  );

  head.position.y = 0.95;
  group.add(head);

  const angle = index * 2.4;
  const radius = 1.1 + (index % 3) * 0.35;

  group.position.set(
    Math.cos(angle) * radius,
    0.2,
    Math.sin(angle) * radius
  );

  scene.add(group);

  dancers.push({
    group,
    angle,
    radius,
    speed: 0.3 + Math.random() * 0.3
  });
}

function syncCustomers() {
  const target = Math.min(data.customers, 15);

  while (dancers.length < target) {
    createPerson(dancers.length);
  }

  while (dancers.length > target) {
    const dancer = dancers.pop();
    scene.remove(dancer.group);
  }
}

syncCustomers();

// ---------------------------
// GAME UI
// ---------------------------

const $ = id => document.getElementById(id);

function formatMoney(amount) {
  return '$' + Math.floor(amount).toLocaleString('en-US');
}

function updateUI() {
  $('cash').textContent = formatMoney(data.cash);
  $('income').textContent =
    formatMoney(data.income);

  $('level').textContent = data.level;

  $('customers').textContent =
    `${data.customers} / ${data.capacity}`;

  $('upgrade').innerHTML =
    `🎧 UPGRADE DJ<br>${formatMoney(data.djCost)}`;

  $('expand').innerHTML =
    `✨ CLUB EXPANSION<br>${formatMoney(data.expansionCost)}`;

  $('upgrade').disabled = data.cash < data.djCost;
  $('expand').disabled =
    data.cash < data.expansionCost;
}

function message(text) {
  $('message').textContent = text;
}

// ---------------------------
// DJ UPGRADE
// ---------------------------

$('upgrade').addEventListener('click', () => {

  if (data.cash < data.djCost) {
    message('Not enough money!');
    return;
  }

  data.cash -= data.djCost;
  data.level++;
  data.income += 5;
  data.capacity += 5;
  data.customers = Math.min(
    data.customers + 3,
    data.capacity
  );

  data.djCost = Math.floor(data.djCost * 1.7);

  message('DJ upgraded! Income increased.');

  syncCustomers();
  updateUI();
  saveGame();
});

// ---------------------------
// EXPANSION
// ---------------------------

$('expand').addEventListener('click', () => {

  if (data.cash < data.expansionCost) {
    message('Save more money for expansion!');
    return;
  }

  data.cash -= data.expansionCost;
  data.level += 2;
  data.income += 25;
  data.capacity += 10;
  data.customers = Math.min(
    data.customers + 5,
    data.capacity
  );

  data.expansionCost =
    Math.floor(data.expansionCost * 2);

  message('Club expanded! Welcome to luxury.');

  syncCustomers();
  updateUI();
  saveGame();
});

// ===========================
// CLUB EMPIRE - BAR BUSINESS
// ===========================

// 3D BAR DISPLAY
const barGroup = new THREE.Group();
scene.add(barGroup);

function barPart(parent, w, h, d, x, y, z, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return mesh;
}

// Neon shelf behind the counter
barPart(barGroup, 3, 0.12, 0.35,
  -4.2, 1.9, -0.8, gold);

barPart(barGroup, 3.1, 0.08, 0.12,
  -4.2, 1.7, -0.8, pink);

// Bottles
for (let i = 0; i < 6; i++) {
  const bottle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.09, 0.42, 8),
    material(
      [0x00ccff, 0xff168a, 0x39dcaa][i % 3]
    )
  );

  bottle.position.set(
    -5.35 + i * 0.46,
    1.48,
    -0.8
  );

  barGroup.add(bottle);
}

// Bartender character
const bartenderGroup = new THREE.Group();
barGroup.add(bartenderGroup);

const bartenderBody = new THREE.Mesh(
  new THREE.CylinderGeometry(0.18, 0.22, 0.7, 8),
  material(0xffffff)
);
bartenderBody.position.set(-4.2, 1.35, -0.85);
bartenderGroup.add(bartenderBody);

const bartenderHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 12, 10),
  material(0xffc99e)
);
bartenderHead.position.set(-4.2, 1.82, -0.85);
bartenderGroup.add(bartenderHead);

const bartenderHair = new THREE.Mesh(
  new THREE.SphereGeometry(0.185, 12, 8),
  black
);
bartenderHair.position.set(-4.2, 1.91, -0.85);
bartenderGroup.add(bartenderHair);

// Hide the new bar until purchased
barGroup.visible = data.barBuilt === 1;
bartenderGroup.visible = data.bartender === 1;

// BUILD BAR
$('buildBar').addEventListener('click', () => {
  if (data.barBuilt === 1) return;

  if (data.cash < 1000) {
    message('You need $1,000 to build the bar!');
    return;
  }

  data.cash -= 1000;
  data.barBuilt = 1;
  barGroup.visible = true;

  message('Your neon bar is now open!');
  updateUI();
  saveGame();
});

// HIRE BARTENDER
$('hireBartender').addEventListener('click', () => {
  if (data.barBuilt !== 1) {
    message('Build your bar first!');
    return;
  }

  if (data.bartender === 1) return;

  if (data.cash < 500) {
    message('You need $500 to hire a bartender!');
    return;
  }

  data.cash -= 500;
  data.bartender = 1;
  data.income += 3;

  bartenderGroup.visible = true;

  message('Bartender hired! +$3/sec income!');
  updateUI();
  saveGame();
});

// UPGRADE BAR
$('upgradeBar').addEventListener('click', () => {
  if (data.bartender !== 1) {
    message('Hire a bartender first!');
    return;
  }

  if (data.barLevel >= 1) {
    message('Your bar is already upgraded!');
    return;
  }

  if (data.cash < 1500) {
    message('You need $1,500 for the bar upgrade!');
    return;
  }

  data.cash -= 1500;
  data.barLevel = 1;
  data.income += 5;

  barGroup.scale.set(1.08, 1.08, 1.08);

  message('Premium bar unlocked! +$5/sec!');
  updateUI();
  saveGame();
});

// UPDATE BAR BUTTONS
function syncBarButtons() {
  const build = $('buildBar');
  const hire = $('hireBartender');
  const upgrade = $('upgradeBar');

  build.textContent = data.barBuilt
    ? '✅ BAR BUILT'
    : '🍹 BUILD BAR — $1,000';

  hire.textContent = data.bartender
    ? '✅ BARTENDER HIRED'
    : '🧑‍🍳 HIRE BARTENDER — $500';

  upgrade.textContent = data.barLevel
    ? '✅ BAR UPGRADED'
    : '⭐ UPGRADE BAR — $1,500';

  build.disabled = data.barBuilt === 1 || data.cash < 1000;

  hire.disabled =
    data.barBuilt !== 1 ||
    data.bartender === 1 ||
    data.cash < 500;

  upgrade.disabled =
    data.bartender !== 1 ||
    data.barLevel >= 1 ||
    data.cash < 1500;
}

setInterval(syncBarButtons, 1000);
syncBarButtons();

// ---------------------------
// IDLE ECONOMY
// ---------------------------

setInterval(() => {

  data.cash += data.income;

  if (data.customers < data.capacity) {
    data.customers++;
    syncCustomers();
  }

  updateUI();
  saveGame();

}, 1000);

// ---------------------------
// OFFLINE REWARD
// ---------------------------

if (offlineMoney > 0) {
  $('notice').style.display = 'block';

  $('notice').innerHTML =
    `<h2>Welcome Back!</h2>
     <p>Your club earned
     <strong>${formatMoney(offlineMoney)}</strong>
     while you were away.</p>
     <button id="claim">COLLECT MONEY</button>`;

  $('claim').addEventListener('click', () => {
    $('notice').style.display = 'none';
  });
}

// ---------------------------
// ANIMATION
// ---------------------------

let time = 0;

function animate() {
  requestAnimationFrame(animate);

  time += 0.016;

  dancers.forEach((dancer, index) => {

    dancer.angle += 0.008 * dancer.speed;

    dancer.group.position.x =
      Math.cos(dancer.angle) * dancer.radius;

    dancer.group.position.z =
      Math.sin(dancer.angle) * dancer.radius;

    dancer.group.position.y =
      0.2 + Math.abs(Math.sin(time * 3 + index)) * 0.2;

    dancer.group.rotation.y =
      Math.sin(time * 2 + index) * 0.5;
  });

  lights.forEach((light, index) => {
    light.intensity =
      15 + Math.sin(time * 3 + index * 2) * 7;
  });

  renderer.render(scene, camera);
}

animate();

// ---------------------------
// SCREEN RESIZE
// ---------------------------

window.addEventListener('resize', () => {

  const aspect =
    window.innerWidth / window.innerHeight;

  const size = 9;

  camera.left = -size * aspect;
  camera.right = size * aspect;
  camera.top = size;
  camera.bottom = -size;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

// ---------------------------
// SAVE ON EXIT
// ---------------------------

// SAVE ON EXIT

window.addEventListener('pagehide', saveGame);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js")
      .catch(error => console.log(error));
  });
}

updateUI();
saveGame();

</script>
</body>
</html>
